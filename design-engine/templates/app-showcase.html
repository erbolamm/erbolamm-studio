<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>App Showcase — NOMBRE_PROYECTO</title>
    <!--
      PLANTILLA: Showcase de App con marcos iPhone/Android
      Resolución: 1920×1080 (horizontal)
      Duración: Ajustar en Stage duration={SEGUNDOS}

      INSTRUCCIONES PARA EL AGENTE IA:
      1. Reemplazar CONFIG con datos reales del proyecto
      2. Embeber screenshots como base64
      3. Elegir marcos: iPhone, Android o ambos
    -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #000; overflow: hidden; font-family: 'Inter', sans-serif; }
        #root { width: 100vw; height: 100vh; }
    </style>
</head>
<body>
<div id="root"></div>

<script>
/* ─── Motor de Animación ─── */
(function() {
    const { createContext, useContext, useState, useEffect } = React;
    const TimeContext = createContext({ time: 0, duration: 20 });
    const SpriteContext = createContext(null);
    const Easing = {
        linear: t => t,
        easeOut: t => 1 - (1 - t) * (1 - t),
        easeInOut: t => t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2,
        expoOut: t => t === 1 ? 1 : 1 - Math.pow(2, -10 * t),
        overshoot: t => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); }
    };
    function interpolate(t, input, output, easing) {
        const [iS, iE] = input; const [oS, oE] = output;
        if (t <= iS) return oS; if (t >= iE) return oE;
        let p = (t - iS) / (iE - iS); if (easing) p = easing(p);
        return oS + (oE - oS) * p;
    }
    function Stage({ duration = 20, width = 1920, height = 1080, children }) {
        const [time, setTime] = useState(0);
        const [scale, setScale] = useState(1);
        useEffect(() => {
            function updateScale() { setScale(Math.min(window.innerWidth / width, window.innerHeight / height)); }
            updateScale(); window.addEventListener('resize', updateScale);
            return () => window.removeEventListener('resize', updateScale);
        }, [width, height]);
        useEffect(() => {
            let last = null, raf;
            const loop = !(typeof window !== 'undefined' && window.__recording);
            const tick = (now) => {
                if (last === null) { last = now; if (typeof window !== 'undefined') window.__ready = true; }
                const delta = (now - last) / 1000; last = now;
                setTime(prev => { const next = prev + delta; return next >= duration ? (loop ? 0 : duration - 0.001) : next; });
                raf = requestAnimationFrame(tick);
            };
            if (document.fonts?.ready) document.fonts.ready.then(() => { raf = requestAnimationFrame(tick); });
            else raf = requestAnimationFrame(tick);
            return () => cancelAnimationFrame(raf);
        }, [duration]);
        return React.createElement(TimeContext.Provider, { value: { time, duration } },
            React.createElement('div', { style: { position: 'fixed', inset: 0, background: '#000', display: 'flex', alignItems: 'center', justifyContent: 'center' } },
                React.createElement('div', { style: { width, height, position: 'relative', overflow: 'hidden', transform: `scale(${scale})`, transformOrigin: 'center center', background: '#05080f' } }, children)
            )
        );
    }
    function Sprite({ start = 0, end, children }) {
        const { time } = useContext(TimeContext);
        if (time < start || time >= (end || 999)) return null;
        return React.createElement(SpriteContext.Provider, { value: { t: (time - start) / ((end || 999) - start), elapsed: time - start, duration: (end || 999) - start } }, children);
    }
    window.Animations = { Stage, Sprite, Easing, interpolate, useTime: () => useContext(TimeContext).time, useSprite: () => useContext(SpriteContext) };
})();
</script>

<script type="text/babel">
const { Stage, Sprite, Easing, interpolate, useTime, useSprite } = window.Animations;

/* ══════════════════════════════════════════════════════════
   CONFIGURACIÓN — EDITAR AQUÍ
   ══════════════════════════════════════════════════════════ */

const CONFIG = {
    nombre: 'NOMBRE_PROYECTO',
    tagline: 'Descripción corta del proyecto',
    duracion: 18,

    color: {
        primary: '#1976D2',
        light: '#42a5f5',
        glow: 'rgba(25, 118, 210, 0.3)',
        bg: '#05080f',
    },

    // Screenshots para los teléfonos (embeber como base64)
    // Proporción ideal: 9:19.5 (iPhone) o 9:20 (Android)
    phones: [
        { src: '', label: 'Pantalla principal' },
        { src: '', label: 'Funcionalidad clave' },
        { src: '', label: 'Configuración' },
    ],

    // Badges
    badges: ['App Store', 'Play Store'],
    stats: '5M+ descargas',
};

/* ══════════════════════════════════════════════════════════
   COMPONENTES
   ══════════════════════════════════════════════════════════ */

const C = CONFIG.color;

const PhoneFrame = ({ src, label, delay, x, rotation = 0 }) => {
    const time = useTime();
    const a = time > delay;
    return <div style={{
        position: 'absolute', left: x, top: '50%',
        transform: `translateY(-50%) rotate(${rotation}deg) scale(${a ? interpolate(time - delay, [0, 0.8], [0.7, 1], Easing.overshoot) : 0.7})`,
        opacity: a ? interpolate(time - delay, [0, 0.6], [0, 1], Easing.expoOut) : 0,
        zIndex: 10,
    }}>
        {/* iPhone frame */}
        <div style={{
            width: 280, height: 580, borderRadius: 40,
            background: '#1a1a2e', border: '3px solid #333',
            boxShadow: `0 20px 60px rgba(0,0,0,0.5), 0 0 40px ${C.glow}`,
            overflow: 'hidden', position: 'relative',
        }}>
            {/* Notch */}
            <div style={{
                position: 'absolute', top: 0, left: '50%', transform: 'translateX(-50%)',
                width: 130, height: 30, background: '#1a1a2e',
                borderBottomLeftRadius: 18, borderBottomRightRadius: 18, zIndex: 5,
            }} />
            {/* Screen */}
            <div style={{ position: 'absolute', inset: 4, borderRadius: 36, overflow: 'hidden', background: '#111' }}>
                {src ? <img src={src} style={{ width: '100%', height: '100%', objectFit: 'cover' }} />
                    : <div style={{ width: '100%', height: '100%', display: 'flex', alignItems: 'center', justifyContent: 'center', color: '#555', fontSize: 14 }}>Screenshot</div>}
            </div>
            {/* Home indicator */}
            <div style={{
                position: 'absolute', bottom: 8, left: '50%', transform: 'translateX(-50%)',
                width: 100, height: 4, borderRadius: 2, background: '#555',
            }} />
        </div>
        {/* Label */}
        {label && <div style={{
            textAlign: 'center', marginTop: 16, fontSize: 14,
            color: '#94a3b8', fontFamily: "'JetBrains Mono', monospace",
            opacity: a ? interpolate(time - delay, [0.3, 0.8], [0, 1]) : 0,
        }}>{label}</div>}
    </div>;
};

const TextReveal = ({ text, delay, size = 28, color = '#e2e8f0', weight = 400, mono = false }) => {
    const time = useTime();
    const a = time > delay;
    return <div style={{
        opacity: a ? interpolate(time - delay, [0, 0.4], [0, 1], Easing.expoOut) : 0,
        transform: `translateY(${a ? interpolate(time - delay, [0, 0.4], [20, 0], Easing.expoOut) : 20}px)`,
        color, fontSize: size, fontWeight: weight,
        fontFamily: mono ? "'JetBrains Mono', monospace" : "'Inter', sans-serif",
    }}>{text}</div>;
};

/* ══════════════════════════════════════════════════════════
   APP
   ══════════════════════════════════════════════════════════ */

const App = () => {
    return (
        <Stage duration={CONFIG.duracion} width={1920} height={1080}>
            {/* Background grid */}
            <div style={{
                position: 'absolute', inset: -200,
                backgroundImage: `linear-gradient(${C.glow.replace('0.3','0.04')} 1px, transparent 1px), linear-gradient(90deg, ${C.glow.replace('0.3','0.04')} 1px, transparent 1px)`,
                backgroundSize: '60px 60px', opacity: 0.3,
            }} />

            {/* Glow orbs */}
            <div style={{ position: 'absolute', left: -100, top: -100, width: 500, height: 500, borderRadius: '50%', background: `radial-gradient(circle, ${C.primary} 0%, transparent 70%)`, opacity: 0.1, filter: 'blur(60px)' }} />
            <div style={{ position: 'absolute', right: -100, bottom: -100, width: 400, height: 400, borderRadius: '50%', background: `radial-gradient(circle, ${C.light} 0%, transparent 70%)`, opacity: 0.08, filter: 'blur(60px)' }} />

            {/* Left side: Text */}
            <div style={{ position: 'absolute', left: 100, top: 0, bottom: 0, width: 600, display: 'flex', flexDirection: 'column', justifyContent: 'center', zIndex: 10 }}>
                <TextReveal text={CONFIG.nombre} delay={0.5} size={64} weight={900} />
                <div style={{ height: 16 }} />
                <TextReveal text={CONFIG.tagline} delay={1} size={28} color={C.light} weight={300} />
                <div style={{ height: 40 }} />
                <TextReveal text={CONFIG.stats} delay={1.5} size={22} color={C.light} mono />
                <div style={{ height: 24 }} />
                <div style={{ display: 'flex', gap: 12 }}>
                    {CONFIG.badges.map((b, i) => {
                        const time = useTime();
                        const d = 2 + i * 0.3;
                        const a = time > d;
                        return <span key={i} style={{
                            display: 'inline-block',
                            opacity: a ? interpolate(time - d, [0, 0.3], [0, 1]) : 0,
                            transform: `scale(${a ? interpolate(time - d, [0, 0.3], [0.8, 1], Easing.overshoot) : 0.8})`,
                            background: `${C.primary}26`, border: `1px solid ${C.primary}4d`,
                            borderRadius: 8, padding: '8px 18px', fontSize: 14, color: C.light,
                            fontWeight: 600, fontFamily: "'JetBrains Mono', monospace",
                        }}>{b}</span>;
                    })}
                </div>
            </div>

            {/* Right side: Phone lineup */}
            {CONFIG.phones.map((p, i) => (
                <PhoneFrame
                    key={i}
                    src={p.src}
                    label={p.label}
                    delay={1 + i * 0.5}
                    x={850 + i * 310}
                    rotation={i === 1 ? 0 : (i === 0 ? -5 : 5)}
                />
            ))}
        </Stage>
    );
};

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
