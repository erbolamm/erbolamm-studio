<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>What's New — NOMBRE_PROYECTO</title>
    <!--
      PLANTILLA: Video "What's New" / Novedades de versión
      Resolución: 1080×1920 (vertical, TikTok/Reels)
      Duración: Ajustar según número de features

      INSTRUCCIONES PARA EL AGENTE IA:
      1. Leer el CHANGELOG.md del proyecto
      2. Extraer las features más importantes de la última versión
      3. Rellenar CONFIG con datos reales
      4. Embeber screenshots como base64 si los hay
    -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #000; overflow: hidden; font-family: 'Inter', sans-serif; }
        #root { width: 100vw; height: 100vh; }
    </style>
</head>
<body>
<div id="root"></div>

<script>
/* ─── Motor de Animación ─── */
(function() {
    const { createContext, useContext, useState, useEffect } = React;
    const TimeContext = createContext({ time: 0, duration: 20 });
    const SpriteContext = createContext(null);
    const Easing = {
        linear: t => t,
        easeOut: t => 1 - (1 - t) * (1 - t),
        expoOut: t => t === 1 ? 1 : 1 - Math.pow(2, -10 * t),
        overshoot: t => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); }
    };
    function interpolate(t, input, output, easing) {
        const [iS, iE] = input; const [oS, oE] = output;
        if (t <= iS) return oS; if (t >= iE) return oE;
        let p = (t - iS) / (iE - iS); if (easing) p = easing(p);
        return oS + (oE - oS) * p;
    }
    function Stage({ duration = 20, width = 1080, height = 1920, children }) {
        const [time, setTime] = useState(0);
        const [scale, setScale] = useState(1);
        useEffect(() => {
            function updateScale() { setScale(Math.min(window.innerWidth / width, window.innerHeight / height)); }
            updateScale(); window.addEventListener('resize', updateScale);
            return () => window.removeEventListener('resize', updateScale);
        }, [width, height]);
        useEffect(() => {
            let last = null, raf;
            const loop = !(typeof window !== 'undefined' && window.__recording);
            const tick = (now) => {
                if (last === null) { last = now; if (typeof window !== 'undefined') window.__ready = true; }
                const delta = (now - last) / 1000; last = now;
                setTime(prev => { const next = prev + delta; return next >= duration ? (loop ? 0 : duration - 0.001) : next; });
                raf = requestAnimationFrame(tick);
            };
            if (document.fonts?.ready) document.fonts.ready.then(() => { raf = requestAnimationFrame(tick); });
            else raf = requestAnimationFrame(tick);
            return () => cancelAnimationFrame(raf);
        }, [duration]);
        return React.createElement(TimeContext.Provider, { value: { time, duration } },
            React.createElement('div', { style: { position: 'fixed', inset: 0, background: '#000', display: 'flex', alignItems: 'center', justifyContent: 'center' } },
                React.createElement('div', { style: { width, height, position: 'relative', overflow: 'hidden', transform: `scale(${scale})`, transformOrigin: 'center center', background: '#05080f' } }, children)
            )
        );
    }
    function Sprite({ start = 0, end, children }) {
        const { time } = useContext(TimeContext);
        if (time < start || time >= (end || 999)) return null;
        return React.createElement(SpriteContext.Provider, { value: { t: (time - start) / ((end || 999) - start), elapsed: time - start } }, children);
    }
    window.Animations = { Stage, Sprite, Easing, interpolate, useTime: () => useContext(TimeContext).time, useSprite: () => useContext(SpriteContext) };
})();
</script>

<script type="text/babel">
const { Stage, Sprite, Easing, interpolate, useTime, useSprite } = window.Animations;

/* ══════════════════════════════════════════════════════════
   CONFIGURACIÓN — EDITAR AQUÍ
   ══════════════════════════════════════════════════════════ */

const CONFIG = {
    nombre: 'NOMBRE_PROYECTO',
    version: 'v1.0',
    fecha: 'Abril 2026',
    duracion: 20,

    color: {
        primary: '#1976D2',
        light: '#42a5f5',
        pale: '#90caf9',
        glow: 'rgba(25, 118, 210, 0.3)',
    },

    // Features del changelog (orden de importancia)
    features: [
        { emoji: '🚀', titulo: 'Feature principal', desc: 'Descripción detallada de la feature más importante de esta versión.', tag: 'NUEVO' },
        { emoji: '⚡', titulo: 'Mejora de rendimiento', desc: 'Explicación de qué se mejoró y cuánto más rápido es.', tag: 'MEJORA' },
        { emoji: '🐛', titulo: 'Bug importante corregido', desc: 'Qué se rompía y cómo se arregló.', tag: 'FIX' },
        { emoji: '🎨', titulo: 'Cambio visual', desc: 'Qué se rediseñó o mejoró visualmente.', tag: 'UI' },
    ],
};

/* ══════════════════════════════════════════════════════════
   COMPONENTES
   ══════════════════════════════════════════════════════════ */

const C = CONFIG.color;
const FEAT_COUNT = CONFIG.features.length;
const HERO_DUR = 4;
const CTA_DUR = 3;
const FEAT_DUR = (CONFIG.duracion - HERO_DUR - CTA_DUR) / FEAT_COUNT;

const tagColors = {
    'NUEVO': '#22c55e', 'MEJORA': '#3b82f6', 'FIX': '#f59e0b', 'UI': '#a855f7',
    'NEW': '#22c55e', 'BREAKING': '#ef4444',
};

const FeatureSlide = ({ feature, index }) => {
    const { elapsed } = useSprite();
    const tagColor = tagColors[feature.tag] || C.primary;

    return <div style={{
        position: 'absolute', inset: 0,
        display: 'flex', flexDirection: 'column',
        justifyContent: 'center', padding: '0 70px',
    }}>
        {/* Number */}
        <div style={{
            fontSize: 120, fontWeight: 900, color: `${C.primary}15`,
            position: 'absolute', right: 60, top: 100,
            opacity: interpolate(elapsed, [0, 0.4], [0, 1]),
        }}>{String(index + 1).padStart(2, '0')}</div>

        {/* Tag */}
        <div style={{
            display: 'inline-block', alignSelf: 'flex-start',
            background: `${tagColor}22`, border: `1px solid ${tagColor}66`,
            borderRadius: 6, padding: '4px 14px', fontSize: 13,
            fontFamily: "'JetBrains Mono', monospace", fontWeight: 700,
            color: tagColor, marginBottom: 20, letterSpacing: 1,
            opacity: interpolate(elapsed, [0.1, 0.4], [0, 1], Easing.expoOut),
            transform: `translateX(${interpolate(elapsed, [0.1, 0.4], [-30, 0], Easing.expoOut)}px)`,
        }}>{feature.tag}</div>

        {/* Emoji */}
        <div style={{
            fontSize: 64, marginBottom: 20,
            opacity: interpolate(elapsed, [0.2, 0.5], [0, 1], Easing.expoOut),
            transform: `scale(${interpolate(elapsed, [0.2, 0.5], [0.5, 1], Easing.overshoot)})`,
        }}>{feature.emoji}</div>

        {/* Title */}
        <div style={{
            fontSize: 44, fontWeight: 800, color: '#e2e8f0',
            lineHeight: 1.2, marginBottom: 20,
            opacity: interpolate(elapsed, [0.3, 0.6], [0, 1], Easing.expoOut),
            transform: `translateY(${interpolate(elapsed, [0.3, 0.6], [30, 0], Easing.expoOut)}px)`,
        }}>{feature.titulo}</div>

        {/* Description */}
        <div style={{
            fontSize: 22, color: '#94a3b8', lineHeight: 1.6, maxWidth: 800,
            opacity: interpolate(elapsed, [0.5, 0.8], [0, 1], Easing.expoOut),
            transform: `translateY(${interpolate(elapsed, [0.5, 0.8], [20, 0], Easing.expoOut)}px)`,
        }}>{feature.desc}</div>

        {/* Progress dots */}
        <div style={{
            position: 'absolute', bottom: 80, left: '50%', transform: 'translateX(-50%)',
            display: 'flex', gap: 12,
        }}>
            {CONFIG.features.map((_, i) => (
                <div key={i} style={{
                    width: i === index ? 28 : 10, height: 10, borderRadius: 5,
                    background: i === index ? C.primary : `${C.primary}33`,
                    transition: 'all 0.3s',
                }} />
            ))}
        </div>
    </div>;
};

const App = () => {
    const D = CONFIG.duracion;

    return (
        <Stage duration={D} width={1080} height={1920}>
            {/* Background */}
            <div style={{
                position: 'absolute', inset: -100,
                backgroundImage: `linear-gradient(${C.glow.replace('0.3','0.04')} 1px, transparent 1px), linear-gradient(90deg, ${C.glow.replace('0.3','0.04')} 1px, transparent 1px)`,
                backgroundSize: '80px 80px', opacity: 0.2,
            }} />

            {/* HERO */}
            <Sprite start={0} end={HERO_DUR}>
                <div style={{ position: 'absolute', inset: 0, display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', zIndex: 10 }}>
                    <div style={{ fontSize: 18, fontFamily: "'JetBrains Mono', monospace", color: C.light, marginBottom: 16,
                        opacity: interpolate(useSprite().elapsed, [0.2, 0.6], [0, 1]),
                    }}>{CONFIG.fecha}</div>
                    <div style={{ fontSize: 72, fontWeight: 900, color: '#e2e8f0', textAlign: 'center',
                        opacity: interpolate(useSprite().elapsed, [0.4, 0.9], [0, 1], Easing.expoOut),
                        transform: `scale(${interpolate(useSprite().elapsed, [0.4, 0.9], [0.8, 1], Easing.overshoot)})`,
                    }}>{CONFIG.nombre}</div>
                    <div style={{ height: 16 }} />
                    <div style={{ display: 'flex', gap: 12, alignItems: 'center',
                        opacity: interpolate(useSprite().elapsed, [1, 1.5], [0, 1]),
                    }}>
                        <span style={{ fontSize: 40, fontWeight: 800, color: C.light, fontFamily: "'JetBrains Mono', monospace" }}>{CONFIG.version}</span>
                        <span style={{ fontSize: 28, color: '#94a3b8' }}>·</span>
                        <span style={{ fontSize: 22, color: '#94a3b8' }}>Novedades</span>
                    </div>
                    <div style={{ position: 'absolute', bottom: 120, opacity: interpolate(useSprite().elapsed, [2, 2.5], [0, 0.6]),
                        fontSize: 16, color: '#64748b', fontFamily: "'JetBrains Mono', monospace",
                    }}>↓ {FEAT_COUNT} cambios importantes</div>
                </div>
            </Sprite>

            {/* FEATURE SLIDES */}
            {CONFIG.features.map((f, i) => (
                <Sprite key={i} start={HERO_DUR + i * FEAT_DUR} end={HERO_DUR + (i + 1) * FEAT_DUR}>
                    <FeatureSlide feature={f} index={i} />
                </Sprite>
            ))}

            {/* CTA */}
            <Sprite start={D - CTA_DUR} end={D}>
                <div style={{ position: 'absolute', inset: 0, display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', zIndex: 10 }}>
                    <div style={{ fontSize: 48, fontWeight: 900, color: '#e2e8f0',
                        opacity: interpolate(useSprite().elapsed, [0.2, 0.6], [0, 1], Easing.expoOut),
                    }}>Actualiza ahora</div>
                    <div style={{ height: 20 }} />
                    <div style={{ fontSize: 18, color: C.light, fontFamily: "'JetBrains Mono', monospace",
                        opacity: interpolate(useSprite().elapsed, [0.6, 1], [0, 1]),
                    }}>{CONFIG.version} disponible</div>
                    <div style={{ height: 30 }} />
                    <div style={{ fontSize: 14, color: '#64748b',
                        opacity: interpolate(useSprite().elapsed, [1, 1.5], [0, 1]),
                    }}>Javier Mateo · ApliArte</div>
                </div>
            </Sprite>
        </Stage>
    );
};

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
